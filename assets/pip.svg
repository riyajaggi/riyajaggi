<svg xmlns="http://www.w3.org/2000/svg" width="180" height="156" viewBox="0 0 180 156" role="img" aria-labelledby="title desc">
  <title id="title">Pip the sprout</title>
  <desc id="desc">An original smiling pixel-style sage sprout pet in a terracotta pot, gently bobbing and blinking beside a tiny sage sparkle.</desc>
  <style>
    .pip { animation: bob 4s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(0.15); } }
    @media (prefers-reduced-motion: reduce) { .pip, .eyes { animation: none; } }
  </style>
  <g class="pip" shape-rendering="crispEdges">
    <path fill="#536B55" d="M86 36h8v36h-8z"/>
    <path fill="#536B55" d="M54 20h24v8h8v24H70v-8h-8v-8h-8zM102 12h24v16h-8v8h-8v8H94V28h8z"/>
    <path fill="#8FA98B" d="M62 28h16v8h-8zM102 28V20h16v8h-8v8h-8z"/>
    <path fill="#222222" d="M46 64h88v24h-8v40h-8v8H62v-8h-8V88h-8z"/>
    <path fill="#E2725B" d="M54 72h72v8H54zM62 88h56v32h-8v8H70v-8h-8z"/>
    <path fill="#9A3F1F" d="M62 88h56v8H62z"/>
    <path class="eyes" fill="#222222" d="M74 100h8v8h-8zM98 100h8v8h-8z"/>
    <path fill="#222222" d="M82 112h16v6H82zM42 96h12v8H42zM126 96h12v8h-12z"/>
    <path fill="#FAF7F4" d="M66 110h8v6h-8zM106 110h8v6h-8z"/>
    <path fill="#8FA98B" d="M142 40h6v6h6v6h-6v6h-6v-6h-6v-6h6z"/>
  </g>
</svg>
